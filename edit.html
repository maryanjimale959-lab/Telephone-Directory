<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Contact - Telephone Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .form-card { border: none; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); }
    </style>
</head>
<body class="py-5">
    <div class="container" style="max-width: 480px;">
        <div class="card form-card bg-white p-4">
            <h4 class="fw-bold mb-1 text-dark"><i class="fa-solid fa-user-pen text-warning me-2"></i>Edit Contact</h4>
            <p class="text-muted small mb-4">Updating details for <strong>{{ name }}</strong></p>
            
            <form action="/edit/{{ name }}" method="POST">
                <div class="mb-3">
                    <label for="phone" class="form-label fw-semibold">Phone Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-phone text-secondary"></i></span>
                        <input type="text" id="phone" name="phone" class="form-control" value="{{ contact.phone }}" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-secondary"></i></span>
                        <input type="email" id="email" name="email" class="form-control" value="{{ contact.email }}">
                    </div>
                </div>
                
                <div class="d-flex justify-content-end gap-2">
                    <a href="/" class="btn btn-light rounded-pill px-4">Cancel</a>
                    <button type="submit" class="btn btn-warning text-dark rounded-pill px-4">Update Contact</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
